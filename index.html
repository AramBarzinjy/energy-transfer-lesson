<body>
<main class="shelf">
  <p class="eyebrow">Your lessons</p>
  <h1>Study library</h1>
  <p class="muted">Pick a subject folder. Each topic is a short lesson you can do in small steps, with its own PowerPoint.</p>
  <div class="grid">
    <a class="tile" href="biology/">
      <svg class="folder" viewBox="0 0 56 44" aria-hidden="true"><path d="M2 8a4 4 0 0 1 4-4h14l5 5h25a4 4 0 0 1 4 4v25a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="var(--leaf)"/><path d="M2 15h52v23a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="var(--leaf)" opacity=".75"/><path d="M33 20c-7 1-11 6-11 14 7-1 11-6 11-14z" fill="var(--sun-fill)"/></svg>
      <h2>Biology</h2>
      <span class="meta">AQA A-level · <span id="bioCount">2 topics</span></span>
    </a>
    <a class="tile" href="chemistry/">
      <svg class="folder" viewBox="0 0 56 44" aria-hidden="true"><path d="M2 8a4 4 0 0 1 4-4h14l5 5h25a4 4 0 0 1 4 4v25a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="#1E5F86"/><path d="M2 15h52v23a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="#1E5F86" opacity=".75"/><path d="M25 19h6v6l5 9a2 2 0 0 1-2 3H22a2 2 0 0 1-2-3l5-9z" fill="var(--sun-fill)"/><path d="M21.5 31h13l1.5 3a2 2 0 0 1-2 3H22a2 2 0 0 1-2-3z" fill="#fff" opacity=".55"/></svg>
      <h2>Chemistry</h2>
      <span class="meta">AQA A-level · 1 topic</span>
    </a>
  </div>
  <p class="hint-ios">Tip: in Safari, tap Share → <b>Add to Home Screen</b> to open this like an app.</p>
</main>
</body>
</html>
